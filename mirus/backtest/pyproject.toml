[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirus-backtest"
version = "0.1.0"
description = "Point-in-time retrieval and distributed Python feature computation for mirus"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["mirus==0.1.0"]

[project.urls]
Repository = "https://github.com/mirusai/mirus"

[project.optional-dependencies]
spark = ["pyspark>=3.5,<4", "pandas>=2,<3", "pyarrow>=12,<20",
         "setuptools>=68; python_version >= '3.12'"]

[tool.setuptools]
packages = ["mirus.backtest", "mirus.backtest.spark"]
package-dir = { "mirus.backtest" = "." }
