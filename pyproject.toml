[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirus"
version = "0.1.0"
description = "mirusai feature computation and payload retrieval library"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["PyYAML>=6,<7"]

[project.urls]
Repository = "https://github.com/mirusai/mirus"

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1,<2"]
spark = ["mirus-backtest[spark]==0.1.0"]
test = ["pytest>=8,<9"]

[tool.setuptools]
packages = ["mirus", "mirus.features", "mirus.payload", "mirus.serving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
